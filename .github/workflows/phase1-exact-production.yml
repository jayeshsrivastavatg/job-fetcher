name: Phase 1 Exact Production Coverage

on:
  push:
    branches:
      - main
      - fix/phase1-exact-website-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -U pip && pip install -e . pytest
      - name: Unit tests
        run: pytest -q tests/test_phase1_exact_sources.py
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify every official Phase 1 website job exists in production output
        run: python scripts/verify_phase1_exact_production.py
      - name: Upload exact coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-exact-production-coverage
          path: reports/phase1-exact-production.json
          if-no-files-found: warn
          retention-days: 30
