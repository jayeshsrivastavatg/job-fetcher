name: ServiceNow Network Inspection

on:
  push:
    branches:
      - fix/phase1-exact-website-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -U pip && pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Inspect ServiceNow employer careers network
        run: python scripts/debug_servicenow_network.py
