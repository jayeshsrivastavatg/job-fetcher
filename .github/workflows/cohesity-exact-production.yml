name: Cohesity Exact Production Coverage

on:
  push:
    branches:
      - fix/phase1-exact-website-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -U pip && pip install -e .
      - name: Compare every first-party Cohesity requisition with production output
        run: |
          python - <<'PY'
          from copy import deepcopy
          from job_fetcher.config import load_config
          from job_fetcher.job_quality import prefer_usable_jobs
          from job_fetcher.sources.cohesity import authoritative_count, flatten_job_data, ENDPOINT
          from job_fetcher.sources.factory import build_source
          from job_fetcher.sources.http_client import session, timeout_seconds

          company = next(c for c in load_config()['companies'] if c['id'] == 'cohesity')

          def site_ids():
              r = session().get(ENDPOINT, timeout=timeout_seconds(), headers={'Accept':'application/json','User-Agent':'PersonalJobFetcherAudit/0.4'})
              r.raise_for_status()
              rows = flatten_job_data(r.json())
              return {(str(x.get('req_id') or x.get('JobID') or '').strip()): x for x in rows if (x.get('req_id') or x.get('JobID'))}

          before = site_ids()
          c = deepcopy(company)
          source = build_source(c)
          jobs = list(prefer_usable_jobs(source.fetch(c)) or [])
          app = {str(j.external_id or '').strip(): j for j in jobs if j.external_id}
          after = site_ids()
          missing = sorted(set(after) - set(app))
          changed = set(before) != set(after)
          print('SOURCE', type(source).__name__)
          print('SITE_BEFORE', len(before), 'SITE_AFTER', len(after), 'APP', len(app))
          print('SITE_CHANGED_DURING_CHECK', changed)
          print('MISSING', len(missing))
          for jid in missing[:20]:
              row = after[jid]
              print('MISSING_JOB', jid, row.get('title'), row.get('primaryLocation'))
          if changed:
              raise SystemExit('site changed during exact check; rerun')
          if missing:
              raise SystemExit('production output is missing first-party Cohesity jobs')
          print('PASS every current first-party Cohesity requisition is in production output')
          PY
