name: Phase 2 Careers Diagnostics

on:
  push:
    branches:
      - fix/phase2-exact-website-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -U pip && pip install -e . pytest
      - name: Probe authoritative Phase 2 sources
        run: python scripts/probe_phase2_sources.py
