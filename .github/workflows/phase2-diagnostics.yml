name: Phase 2 Careers Diagnostics

on:
  push:
    branches:
      - fix/phase2-exact-website-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -U pip && pip install -e . pytest
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Inspect official Phase 2 careers surfaces and current app output
        run: python scripts/diagnose_phase2_surfaces.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-careers-diagnostics
          path: reports/phase2-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
