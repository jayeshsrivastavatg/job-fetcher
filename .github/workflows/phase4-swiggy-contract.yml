name: Phase 4 Swiggy Contract Probe

on:
  workflow_dispatch:
  push:
    branches:
      - fix/phase4-zero-job-failures
    paths:
      - .github/workflows/phase4-swiggy-contract.yml
      - scripts/probe_swiggy_contract.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Inspect public Swiggy scripts and API
        run: python scripts/probe_swiggy_contract.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-swiggy-contract
          path: reports/phase4/swiggy-contract.json
          if-no-files-found: warn
          retention-days: 7
