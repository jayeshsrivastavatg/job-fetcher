name: Skima Contract Probe
on:
  push:
    branches: [fix/phase4-zero-job-failures]
    paths:
      - 'scripts/probe_skima_contract.py'
      - '.github/workflows/skima-contract-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt && pip install -e .
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/probe_skima_contract.py
