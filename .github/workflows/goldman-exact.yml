name: Goldman Exact
on:
  push:
    branches: [fix/phase4-zero-job-failures]
    paths: ['scripts/verify_goldman_exact.py', '.github/workflows/goldman-exact.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt && pip install -e .
      - run: python scripts/verify_goldman_exact.py
