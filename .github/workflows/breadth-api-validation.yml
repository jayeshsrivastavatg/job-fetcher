name: Breadth API Validation

on:
  push:
    branches: [fix/phase4-zero-job-failures]
    paths:
      - 'scripts/verify_dedicated_public_exact.py'
      - '.github/workflows/breadth-api-validation.yml'
  workflow_dispatch:

concurrency:
  group: breadth-api-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedicated-public:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt && pip install -e .
      - env:
          JOB_FETCHER_DISABLE_BROWSER: '1'
          JOB_FETCHER_HTTP_TIMEOUT: '20'
        run: python scripts/verify_dedicated_public_exact.py
