name: Phase 3 Eightfold Diagnostics

on:
  push:
    branches:
      - fix/phase3-eightfold-exact-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -U pip && pip install -e . pytest
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Diagnose production and official careers inventory
        run: python scripts/diagnose_phase3_eightfold.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-eightfold-diagnostics
          path: reports/phase3-eightfold-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
