name: Phase 3 Eightfold Diagnostics

on:
  push:
    branches:
      - fix/phase3-eightfold-exact-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -U pip && pip install -e . pytest
      - name: Probe direct Eightfold PCS search API
        run: python scripts/probe_phase3_pcsx.py
