name: Cohesity Payload Inspection

on:
  push:
    branches:
      - fix/phase1-exact-website-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect first-party Cohesity jobs JSON
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://www.cohesity.com/bin/cohesity/open-positions/'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 PersonalJobFetcherAudit/0.1', 'Accept': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          print('TOP_KEYS', sorted(data.keys()))
          jobs = data.get('job_data')
          print('JOB_DATA_TYPE', type(jobs).__name__)
          if isinstance(jobs, list):
              print('JOB_COUNT', len(jobs))
              for i, row in enumerate(jobs[:3]):
                  print('JOB', i, json.dumps(row, ensure_ascii=False, default=str)[:12000])
          elif isinstance(jobs, dict):
              print('JOB_DATA_KEYS', list(jobs.keys())[:30])
              for key, value in list(jobs.items())[:3]:
                  print('JOB_ITEM', key, json.dumps(value, ensure_ascii=False, default=str)[:12000])
          print('DEPTS', json.dumps(data.get('careerSiteDeptList'), ensure_ascii=False, default=str)[:4000])
          print('LOCATIONS', json.dumps(data.get('locationsByCountry'), ensure_ascii=False, default=str)[:4000])
          PY
