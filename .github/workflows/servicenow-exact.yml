name: ServiceNow Exact Website Coverage

on:
  push:
    branches:
      - audit/phase1-website-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -U pip && pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify every ServiceNow employer-site vacancy exists in app output
        run: python scripts/verify_servicenow_exact.py
