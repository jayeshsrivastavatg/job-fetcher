name: Phase 4 ATS Bundle Contract Probe

on:
  workflow_dispatch:
  push:
    branches:
      - fix/phase4-zero-job-failures
    paths:
      - scripts/phase4_bundle_contract_probe.py
      - .github/workflows/phase4-bundle-contract.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        target:
          - rakuten_india
          - sony_tech_india
          - makemytrip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Inspect public application bundle
        run: >-
          python scripts/phase4_bundle_contract_probe.py
          --target ${{ matrix.target }}
          --output reports/phase4/${{ matrix.target }}-bundle.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-${{ matrix.target }}-bundle
          path: reports/phase4/${{ matrix.target }}-bundle.json
          if-no-files-found: warn
          retention-days: 7
