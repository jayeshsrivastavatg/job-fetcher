name: Phase 1 Website Coverage

on:
  push:
    branches:
      - audit/phase1-website-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -U pip && pip install -e .
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compare official websites with app output
        run: python scripts/verify_phase1_website_coverage.py --output reports/phase1-website-coverage.json
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/phase1-website-coverage.md ]; then
            cat reports/phase1-website-coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-website-coverage
          path: |
            reports/phase1-website-coverage.json
            reports/phase1-website-coverage.md
          if-no-files-found: warn
          retention-days: 30
