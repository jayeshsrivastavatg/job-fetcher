name: Bootstrap repository

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'chore: stage verified baseline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified baseline
        run: |
          unzip -o job-fetcher-github-baseline.zip
          rm -f job-fetcher-github-baseline.zip .github/workflows/bootstrap.yml .github-seed
      - name: Commit project baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial job discovery and relevance pipeline"
          git push origin HEAD:main
