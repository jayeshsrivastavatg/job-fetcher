name: Bootstrap repository

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified baseline
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f job-fetcher-github-baseline.zip ]; then
            echo "Baseline already expanded; nothing to do."
            exit 0
          fi
          base64 --decode job-fetcher-github-baseline.zip > baseline.zip
          unzip -t baseline.zip
          unzip -o baseline.zip
          # Workflow files are installed later through the GitHub connector.
          # The Actions token can be blocked from modifying .github/workflows.
          rm -f .github/workflows/ci.yml
          rm -f job-fetcher-github-baseline.zip baseline.zip .github-seed
      - name: Commit project baseline
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No project changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial job discovery and relevance pipeline"
          git push origin HEAD:main
