name: Bootstrap repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and expand verified baseline
        run: |
          base64 --decode job-fetcher-github-baseline.zip > baseline.zip
          unzip -o baseline.zip
          rm -f baseline.zip job-fetcher-github-baseline.zip .github/workflows/bootstrap.yml .github-seed
      - name: Commit project baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial job discovery and relevance pipeline"
          git push origin HEAD:main
