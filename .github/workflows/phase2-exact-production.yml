name: Phase 2 Exact Production Coverage

on:
  push:
    branches:
      - fix/phase2-exact-website-coverage
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -U pip && pip install -e . pytest
      - name: Unit tests
        run: pytest -q tests/test_phase2_exact_sources.py
      - name: Verify every current official Phase 2 vacancy exists in production output
        run: python scripts/verify_phase2_exact_production.py
      - name: Upload exact coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-exact-production-coverage
          path: reports/phase2-exact-production.json
          if-no-files-found: warn
          retention-days: 30
