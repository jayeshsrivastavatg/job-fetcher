name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JOB_FETCHER_DISABLE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -U pip && pip install -e '.[dev]'
      - name: Validate config
        run: python -m job_fetcher.cli validate-config
      - name: Validate relevance profile
        run: python -m job_fetcher.cli validate-profile
      - name: Test
        run: pytest -q
