[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "job-fetcher"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.45,<2",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "Jinja2>=3.1,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"job_fetcher.web" = ["templates/*.html", "static/*"]


[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]
